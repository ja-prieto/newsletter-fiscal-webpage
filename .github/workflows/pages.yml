# El despliegue de la web del boletín en GitHub Pages. Vive en el repositorio de la web, donde
# lo copia `scripts/publicar_web.sh` en cada publicación; el original está en
# `newsletter-fiscal/scripts/pages/`. La web ya llega construida: aquí solo se sube tal cual.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicaciones seguidas, manda la última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
